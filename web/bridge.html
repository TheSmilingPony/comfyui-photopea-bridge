<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Photopea</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #2b2b2b;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      // Hosts Photopea for the ComfyUI page in another tab and relays Live
      // Messaging in both directions, so that page keeps talking to Photopea.
      const PHOTOPEA_ORIGIN = "https://www.photopea.com";
      const HELLO = "photopea-bridge:hello";

      const frame = document.createElement("iframe");
      frame.allow = "clipboard-read; clipboard-write";
      frame.src = PHOTOPEA_ORIGIN;
      document.body.append(frame);

      // This tab outlives the ComfyUI page that opened it, so it remembers that
      // Photopea has loaded and answers the opener's hello on the next visit.
      let loaded = false;

      window.addEventListener("message", (event) => {
        const opener = window.opener;
        if (!opener) return;

        if (event.source === frame.contentWindow && event.data === "done") loaded = true;

        if (event.source === opener && event.origin === location.origin) {
          if (event.data === HELLO) {
            if (loaded) opener.postMessage("done", location.origin);
            return;
          }
          frame.contentWindow.postMessage(event.data, "*");
        } else if (event.origin === PHOTOPEA_ORIGIN || event.source === frame.contentWindow) {
          opener.postMessage(event.data, location.origin);
        }
      });
    </script>
  </body>
</html>
